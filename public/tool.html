<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Writing Studio – Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="workspace-bg">

<div class="workspace-grid">

  <!-- Sidebar -->
  <aside class="sidebar glass">
    <div class="logo-area">
      <div class="logo-title">AI Writing Studio</div>
      <div class="logo-sub">Premium Writing Workspace</div>
    </div>

    <div class="menu-section">
      <p class="menu-label">자동 생성</p>
      <button onclick="setMode('auto')" class="menu-btn">✨ 자동 글 생성</button>
    </div>

    <div class="menu-section">
      <p class="menu-label">문서 작업</p>
      <button onclick="setMode('summary')" class="menu-btn">📝 요약</button>
      <button onclick="setMode('email')" class="menu-btn">📧 이메일</button>
      <button onclick="setMode('reply')" class="menu-btn">💬 답장</button>
      <button onclick="setMode('report')" class="menu-btn">📄 보고서</button>
    </div>

    <div class="menu-section">
      <p class="menu-label">블로그</p>
      <button onclick="setMode('blog')" class="menu-btn">✍ 블로그 전체 작성</button>
      <button onclick="setMode('blog_step1')" class="menu-btn">1️⃣ STEP1 분석</button>
      <button onclick="setMode('blog_step2')" class="menu-btn">2️⃣ STEP2 개요</button>
      <button onclick="setMode('blog_step3')" class="menu-btn">3️⃣ STEP3 본문</button>
    </div>

    <div class="menu-section">
      <p class="menu-label">리라이팅</p>
      <button onclick="setMode('rewrite_soft')" class="menu-btn">♻ 부드럽게</button>
      <button onclick="setMode('rewrite_pro')" class="menu-btn">💼 전문적으로</button>
      <button onclick="setMode('rewrite_short')" class="menu-btn">🔍 핵심 요약</button>
      <button onclick="setMode('rewrite_long')" class="menu-btn">🔎 확장</button>
    </div>

    <div class="menu-section">
      <p class="menu-label">기타 기능</p>
      <button onclick="setMode('seo')" class="menu-btn">⚡ SEO 분석</button>
      <button onclick="setMode('multi')" class="menu-btn">🎨 3버전 생성</button>
      <button onclick="setMode('idea')" class="menu-btn">💡 아이디어</button>
      <button onclick="setMode('analyze')" class="menu-btn">📚 글 점수 분석</button>
      <button onclick="setMode('imgprompt')" class="menu-btn">🖼 이미지 프롬프트</button>
    </div>
  </aside>

  <!-- Main Panel -->
  <main class="main-panel">

    <div class="panel-header">
      <h2 id="functionTitle">✨ 자동 글 생성</h2>
      <p id="functionDesc" class="panel-desc">
        키워드만 입력하면 AI가 고품질 글을 자동 생성합니다.
      </p>
    </div>

    <!-- Input -->
    <section class="panel glass-white">
      <label class="panel-label">입력 내용</label>
      <textarea id="userInput" placeholder="주제 또는 텍스트를 입력하세요."></textarea>
    </section>

    <!-- Options -->
    <section class="panel glass-white options-panel">
      <div class="opt-box">
        <label>글 길이</label>
        <select id="length">
          <option value="normal">보통</option>
          <option value="short">짧게</option>
          <option value="long">길게</option>
        </select>
      </div>

      <div class="opt-box">
        <label>톤</label>
        <select id="tone">
          <option value="default">기본</option>
          <option value="warm">따뜻하게</option>
          <option value="professional">전문적으로</option>
          <option value="emotional">감성적으로</option>
          <option value="mz">MZ 스타일</option>
          <option value="news">뉴스체</option>
          <option value="thesis">논문체</option>
          <option value="copy">카피라이팅</option>
          <option value="sns">SNS 스타일</option>
          <option value="lecture">강의하듯</option>
        </select>
      </div>

      <div class="btn-box">
        <button class="btn primary" onclick="generate()">🚀 생성</button>
        <button class="btn reset" onclick="resetFields()">🔄 초기화</button>
        <button class="btn copy" onclick="copyText()">📋 복사</button>
      </div>
    </section>

    <!-- Output -->
    <section class="panel glass-white big-output">
      <label class="panel-label">결과</label>
      <pre id="resultBox">결과가 여기에 표시됩니다.</pre>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
